version: '3.8'
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: polbangtan_app
    restart: unless-stopped
    volumes:
      - ./.env:/var/www/html/.env
      - ./storage:/var/www/html/storage

  web:
    image: nginx:alpine
    container_name: polbangtan_web
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: polbangtan_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_USER: ${DB_USERNAME}
    volumes:
      - polbangtan_db_data:/var/lib/mysql

volumes:
  polbangtan_db_data: