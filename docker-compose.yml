# ==============================================================================
# Production Docker Compose for E-Management Polbangtan-mlg
# Target: Linux Debian VPS
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # Application Core (PHP 8.3-FPM)
  # ----------------------------------------------------------------------------
  asrama-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: polbangtan_prod_app
    restart: always
    volumes:
      - ./.env:/var/www/html/.env:ro
      - asrama_storage:/var/www/html/storage
      - asrama_bootstrap_cache:/var/www/html/bootstrap/cache
    depends_on:
      asrama-db:
        condition: service_healthy
      asrama-redis:
        condition: service_healthy
    networks:
      - polbangtan_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 1024M

  # ----------------------------------------------------------------------------
  # Web Server & Reverse Proxy (Nginx)
  # ----------------------------------------------------------------------------
  asrama-web:
    image: nginx:alpine
    container_name: polbangtan_prod_web
    restart: always
    ports:
      # Terikat ke loopback host (127.0.0.1) agar diproxy oleh Host Nginx/SSL
      - "${DOCKER_APP_PORT:-8000}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/html/public:ro
      - asrama_storage:/var/www/html/storage:ro
    depends_on:
      - asrama-app
    networks:
      - polbangtan_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ----------------------------------------------------------------------------
  # Asynchronous Background Worker (Laravel Queue Worker)
  # ----------------------------------------------------------------------------
  asrama-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: polbangtan_prod_worker
    restart: always
    command: php artisan queue:work redis --verbose --tries=3 --timeout=120 --memory=256 --max-jobs=1000 --max-time=3600
    volumes:
      - ./.env:/var/www/html/.env:ro
      - asrama_storage:/var/www/html/storage
      - asrama_bootstrap_cache:/var/www/html/bootstrap/cache
    depends_on:
      asrama-db:
        condition: service_healthy
      asrama-redis:
        condition: service_healthy
    networks:
      - polbangtan_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M

  # ----------------------------------------------------------------------------
  # Scheduled Cron Runner (Laravel Scheduler)
  # ----------------------------------------------------------------------------
  asrama-scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: polbangtan_prod_scheduler
    restart: always
    command: php artisan schedule:work
    volumes:
      - ./.env:/var/www/html/.env:ro
      - asrama_storage:/var/www/html/storage
      - asrama_bootstrap_cache:/var/www/html/bootstrap/cache
    depends_on:
      asrama-db:
        condition: service_healthy
      asrama-redis:
        condition: service_healthy
    networks:
      - polbangtan_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

  # ----------------------------------------------------------------------------
  # In-Memory Cache, Session & Queue Engine (Redis 7)
  # ----------------------------------------------------------------------------
  asrama-redis:
    image: redis:7-alpine
    container_name: polbangtan_prod_redis
    restart: always
    command: redis-server --requirepass "${REDIS_PASSWORD}" --appendonly yes
    volumes:
      - asrama_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - polbangtan_net
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

  # ----------------------------------------------------------------------------
  # Relational Database (MySQL 8.0)
  # ----------------------------------------------------------------------------
  asrama-db:
    image: mysql:8.0
    container_name: polbangtan_prod_db
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - asrama_db_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/custom.cnf:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - polbangtan_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "1.50"
          memory: 1024M

# ------------------------------------------------------------------------------
# Storage Volumes & Private Network
# ------------------------------------------------------------------------------
volumes:
  asrama_db_data:
    name: polbangtan_prod_db_data
  asrama_redis_data:
    name: polbangtan_prod_redis_data
  asrama_storage:
    name: polbangtan_prod_storage
  asrama_bootstrap_cache:
    name: polbangtan_prod_bootstrap_cache

networks:
  polbangtan_net:
    name: polbangtan_prod_network
    driver: bridge
