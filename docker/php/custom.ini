; Custom PHP Configuration for E-Management Production (Linux Debian VPS)
memory_limit = 512M
upload_max_filesize = 50M
post_max_size = 55M
max_execution_time = 300
max_input_time = 300
expose_php = Off

; Error handling & logging
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; Date and time
date.timezone = Asia/Jakarta
